server:
  port: 8008

database:
  url: postgres://postgres:postgres@localhost:5432/postgres

redis:
  url: redis://localhost:6379

concrnt:
  domain: concrnt.example.com
  # ccid is derived from privateKey and does not need to be configured.
  privateKey: |
    replace-with-your-concrnt-private-key

activitypub:
  # Change only when preserving actor URLs from an existing installation.
  actorPathSegment: users

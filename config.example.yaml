server:
  port: 8008

database:
  url: postgres://postgres:postgres@localhost:5432/postgres

redis:
  url: redis://localhost:6379

concrnt:
  domain: concrnt.example.com
  # ccidはprivateKeyから導出されるため設定不要
  privateKey: replace-with-your-concrnt-private-key

# activitypub:
#   # 受信ノート本文のRedisキャッシュTTL(秒)。デフォルト30日
#   objectCacheTTL: 2592000
#   # dev専用: ローカルのモックactorへのfetch/配送を許可する(SSRF防御が無効になるため本番では設定しない)
#   allowPrivateAddress: true
